name: plugin ci

# Checks the plugin package on every PR and on main, so a broken manifest, an invalid skill,
# a reference to a tool the connector doesn't expose, or a bad upload ZIP is caught before
# it reaches the Claude or OpenAI plugin directories.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Manifest, skills and listing rules (OpenAI + Agent Skills / Codex)
        run: python3 scripts/validate_plugin.py

      - name: Skills cover every connector tool and name no missing ones
        run: node scripts/check-coverage.mjs

      - name: Claude plugin manifest (claude plugin validate --strict)
        # Pinned: an unpinned npx can reuse an older Claude Code from the runner image, and
        # versions before 2.1.281 warn on the directory listing fields (icon, supportUrl, ...),
        # which --strict turns into a failure.
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.292 --version
          npx --yes @anthropic-ai/claude-code@2.1.292 plugin validate --strict .

      - name: Build the OpenAI upload ZIP and re-validate its contents
        run: |
          npm run pack:openai
          zip=$(ls dist/*.zip)
          unzip -tq "$zip"
          mkdir -p /tmp/upload && unzip -q "$zip" -d /tmp/upload
          test -f /tmp/upload/.codex-plugin/plugin.json
          test ! -e /tmp/upload/.claude-plugin
          python3 scripts/validate_plugin.py /tmp/upload
          # The ZIP carries OpenAI's MCP form; the repo keeps Claude's (Claude Code / directory read it).
          python3 - <<'EOF'
          import json
          z = json.load(open('/tmp/upload/.mcp.json'))['mcpServers']
          r = json.load(open('.mcp.json'))['mcpServers']
          assert z.keys() == r.keys(), (z.keys(), r.keys())
          for k in z:
              assert z[k] == {'type': 'streamable-http', 'url': r[k]['url']}, z[k]
              assert r[k]['type'] == 'http' and 'oauth' in r[k], r[k]
          print('mcp.json: upload uses streamable-http; repo keeps the Claude form')
          EOF

      - name: npm package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          grep -q "installer/install.mjs" /tmp/pack.txt
          ! grep -qE " (commands|dist|bin)/" /tmp/pack.txt

      - name: Listing links are live
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys
          m = json.load(open('.codex-plugin/plugin.json'))
          urls = {m['homepage'], m['author']['url']}
          urls |= {m['interface'][k] for k in ('websiteURL', 'supportURL', 'privacyPolicyURL', 'termsOfServiceURL')}
          bad = []
          for u in sorted(urls):
              code = subprocess.run(['curl', '-s', '-o', '/dev/null', '-L', '-m', '20', '-w', '%{http_code}', u],
                                    capture_output=True, text=True).stdout
              print(code, u)
              if code != '200':
                  bad.append(u)
          sys.exit(1 if bad else 0)
          EOF
